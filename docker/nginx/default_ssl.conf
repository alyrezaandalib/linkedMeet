server {
    listen 80;
    listen [::]:80;
    server_name bakhtnama.ir api.bakhtnama.ir;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bakhtnama.ir;
    root /var/www/html/public;

    ssl_certificate /etc/nginx/ssl/live/bakhtnama.ir/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/bakhtnama.ir/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass backend-app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.bakhtnama.ir;

    ssl_certificate /etc/nginx/ssl/live/bakhtnama.ir/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/bakhtnama.ir/privkey.pem;

    location / {
        proxy_pass http://frontend-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name broadcast.bakhtnama.ir;

    ssl_certificate /etc/nginx/ssl/live/bakhtnama.ir/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/bakhtnama.ir/privkey.pem;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_pass http://backend-app:8080;
    }
}
