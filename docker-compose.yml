name: linkedmeet

services:
    app:
        container_name: "app"
        build:
            context: .
            dockerfile: docker/app/Dockerfile
            args:
                - UID=${UID:-1000}
                - GID=${GID:-1000}
        image: linkedmeet-app:latest
        ports:
            - "9000:9000"
            - "8080:8080"
        volumes:
            - .:/var/www/html:delegated
        depends_on:
            - mariadb
            - redis
        mem_limit: 1g
        cpus: "0.5"
        networks:
            - linkedmeet
    frontend:
        container_name: "frontend"
        image: linkedmeet-frontend:latest
        ports:
            - "3000:3000"
        volumes:
            - frontend_data:/app
        depends_on:
            - app
        mem_limit: 1g
        cpus: "0.5"
        networks:
            - linkedmeet
    mariadb:
        container_name: "mariadb"
        build:
            context: .
            dockerfile: docker/mariadb/Dockerfile
            args:
                - UID=${UID:-1000}
                - GID=${GID:-1000}
        image: linkedmeet-mariadb:lts
        environment:
            MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
            MARIADB_DATABASE: ${DB_DATABASE}
            MARIADB_USER: ${DB_USERNAME}
            MARIADB_PASSWORD: ${DB_PASSWORD}
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        restart: always
        volumes:
            - ./docker/mariadb/data:/var/lib/mysql
            - ./docker/mariadb/conf.d:/etc/mysql/conf.d:ro
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            retries: 3
            timeout: 5s
        mem_limit: 2g
        cpus: "1"
        depends_on:
            - redis
        networks:
            - linkedmeet
    redis:
        container_name: "redis"
        image: redis:alpine
        ports:
            - "6379:6379"
        volumes:
            - ./docker/redis/data:/data
        mem_limit: 1g
        cpus: "0.5"
        networks:
            - linkedmeet
    nginx:
        container_name: "nginx"
        build:
            context: .
            dockerfile: docker/nginx/Dockerfile
            args:
                - UID=${UID:-1000}
                - GID=${GID:-1000}
        image: linkedmeet-nginx:latest
        volumes:
            - .:/var/www/html:delegated
            - frontend_data:/app
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./docker/nginx/certbot/www:/var/www/certbot/:ro
            - ./docker/nginx/certbot/conf/:/etc/nginx/ssl/:ro
        ports:
            - "80:80"
            - "443:443"
            - "3001:3001"
        restart: always
        depends_on:
            - app
        mem_limit: 512m
        cpus: "0.5"
        networks:
            - linkedmeet
    certbot:
        container_name: "certbot"
        image: certbot/certbot:latest
        volumes:
            - ./docker/nginx/certbot/www:/var/www/certbot/:rw
            - ./docker/nginx/certbot/conf/:/etc/letsencrypt/:rw
        networks:
            - linkedmeet
    composer:
        container_name: composer
        build:
            context: .
            dockerfile: docker/app/Dockerfile
            args:
                - UID=${UID:-1000}
                - GID=${GID:-1000}
        volumes:
            - .:/var/www/html
        depends_on:
            - app
        entrypoint: [ 'composer', '--ignore-platform-reqs' ]
        networks:
            - linkedmeet
    artisan:
        container_name: artisan
        build:
            context: .
            dockerfile: docker/app/Dockerfile
            args:
                - UID=${UID:-1000}
                - GID=${GID:-1000}
        volumes:
            - .:/var/www/html:delegated
        depends_on:
            - mariadb
        entrypoint: [ 'php', '/var/www/html/artisan' ]
        networks:
            - linkedmeet
    npm:
        container_name: npm
        image: node:lts-alpine
        volumes:
            - .:/var/www/LinkedMeet
        ports:
            - "3000:3000"
            - "3001:3001"
            - "5173:5173"
        working_dir: /var/www/LinkedMeet
        entrypoint: [ 'npm' ]
        networks:
            - linkedmeet

volumes:
    frontend_data:

networks:
    linkedmeet:
        driver: bridge
