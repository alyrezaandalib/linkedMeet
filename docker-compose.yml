name: linkedmeet

services:
    app:
        container_name: "backend-app"
        build:
            context: .
            dockerfile: docker/app/Dockerfile
            args:
                - UID=${UID:-1000}
                - GID=${GID:-1000}
        image: linkedmeet-app:latest
        ports:
            - "9000:9000"
            - "8000:8000"
        volumes:
            - .:/var/www/html:delegated
        depends_on:
            - mariadb
            - redis
        mem_limit: 1g
        cpus: "0.5"
        networks:
            - linkedmeet
    mariadb:
        container_name: "mariadb"
        build:
            context: .
            dockerfile: docker/mariadb/Dockerfile
            args:
                - UID=${UID:-1000}
                - GID=${GID:-1000}
        image: linkedmeet-mariadb:lts
        environment:
            MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
            MARIADB_DATABASE: ${DB_DATABASE}
            MARIADB_USER: ${DB_USERNAME}
            MARIADB_PASSWORD: ${DB_PASSWORD}
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        restart: always
        volumes:
            - ./docker/mariadb/data:/var/lib/mysql
            - ./docker/mariadb/conf.d:/etc/mysql/conf.d:ro
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            retries: 3
            timeout: 5s
        mem_limit: 2g
        cpus: "1"
        depends_on:
            - redis
        networks:
            - linkedmeet
    redis:
        container_name: "redis"
        image: redis:alpine
        ports:
            - "6379:6379"
        volumes:
            - ./docker/redis/data:/data
        mem_limit: 1g
        cpus: "0.5"
        networks:
            - linkedmeet
    nginx:
        container_name: "nginx"
        build:
            context: .
            dockerfile: docker/nginx/Dockerfile
            args:
                - UID=${UID:-1000}
                - GID=${GID:-1000}
        image: linkedmeet-nginx:latest
        volumes:
             - .:/var/www/html:delegated
             - ./docker/nginx/default_local.conf:/etc/nginx/conf.d/default.conf
        ports:
            - "8080:80"
        restart: always
        depends_on:
            - app
        mem_limit: 512m
        cpus: "0.5"
        networks:
            - linkedmeet
    # certbot:
    #     image: certbot/certbot:latest
    #     volumes:
    #         - ./docker/nginx/certbot/www:/var/www/certbot/:rw
    #         - ./docker/nginx/certbot/conf/:/etc/letsencrypt/:rw
    #     profiles:
    #         - tools
    #     networks:
    #         - linkedmeet
    composer:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
            args:
                - UID=${UID:-1000}
                - GID=${GID:-1000}
        image: linkedmeet-app:latest
        volumes:
            - .:/var/www/html
        entrypoint: [ 'composer', '--ignore-platform-reqs' ]
        profiles:
            - tools
        networks:
            - linkedmeet
    artisan:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
            args:
                - UID=${UID:-1000}
                - GID=${GID:-1000}
        image: linkedmeet-app:latest
        volumes:
            - .:/var/www/html
        depends_on:
            - mariadb
        entrypoint: [ 'php', '/var/www/html/artisan' ]
        profiles:
            - tools
        networks:
            - linkedmeet
    npm:
        image: node:lts-alpine
        volumes:
            - .:/var/www/html
        ports:
            - "5173:5173"
        working_dir: /var/www/html
        entrypoint: [ 'npm' ]
        profiles:
            - tools
        networks:
            - linkedmeet
    phpmyadmin:
        container_name: phpmyadmin
        image: phpmyadmin/phpmyadmin:latest
        restart: always
        ports:
            - "8081:80"
        environment:
            PMA_HOST: mariadb
            PMA_PORT: 3306
            PMA_USER: ${DB_USERNAME}
            PMA_PASSWORD: ${DB_PASSWORD}
        depends_on:
            - mariadb
        networks:
            - linkedmeet
        
networks:
    linkedmeet:
        driver: bridge
#        external: true
